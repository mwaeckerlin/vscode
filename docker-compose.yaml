services:
  vscode:
    image: mwaeckerlin/vscode
    build: .
    privileged: true
    ports:
      - 8080:8080
    volumes:
      - code:/code
    environment:
      # one of the two is required, the container refuses to start without;
      # there is no default password, a published one would open every
      # installation that keeps it
      PASSWORD: ${PASSWORD:-}
      HASHED_PASSWORD: ${HASHED_PASSWORD:-}
    depends_on:
      - fix-access
  # gives the unprivileged user of the image write access to the volume
  fix-access:
    image: mwaeckerlin/allow-write-access
    volumes:
      - code:/app/code

volumes:
  code:
